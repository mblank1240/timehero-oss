name: Image

# Publishes the Docker images to GitHub's container registry for each release
# tag, so a self-hosted install can pull rather than build:
#
#   ghcr.io/<owner>/timehero        the server (Dockerfile target `app`)
#   ghcr.io/<owner>/timehero-tools  migrations, `npm run setup`, the import
#                                   (target `tools`)
#
# Tagged 1.2.3 and 1.2, and `latest` when it is the newest release (never for
# a pre-release like v1.3.0-rc.1). For linux/amd64 and linux/arm64.
#
# Runs on pushing a v* tag. To publish a tag that predates this workflow, run
# it by hand: `gh workflow run image.yml -f tag=v0.1.0`.
#
# A new package on GHCR starts private: make each one public once, under the
# package's settings, for anyone to pull it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }}
          # Every tag, to tell whether this one is the newest release.
          fetch-depth: 0

      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?$ ]]; then
            echo "::error::\"$TAG\" is not a release tag (vX.Y.Z)."
            exit 1
          fi
          version="${TAG#v}"
          minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          prerelease="${BASH_REMATCH[4]}"
          newest="$(git tag --list 'v*' --sort=-v:refname | grep -Ev -- '-' | head -n1)"
          owner="${GITHUB_REPOSITORY_OWNER,,}"

          for name in timehero timehero-tools; do
            image="ghcr.io/$owner/$name"
            {
              echo "${name//-/_}<<EOF"
              echo "$image:$version"
              if [ -z "$prerelease" ]; then
                echo "$image:$minor"
                if [ "$TAG" = "$newest" ]; then echo "$image:latest"; fi
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `context: .` builds the checked-out tag, not the commit that triggered
      # the run. The source label links each package to this repository.
      - name: Server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.timehero }}
          labels: |
            org.opencontainers.image.title=TimeHero
            org.opencontainers.image.description=Time and leave management for small organizations
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.revision }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tools image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: tools
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.timehero_tools }}
          labels: |
            org.opencontainers.image.title=TimeHero tools
            org.opencontainers.image.description=TimeHero migrations, setup and import
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.revision }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
