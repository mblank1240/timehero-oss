# TimeHero with PostgreSQL and its scheduled jobs. docs/SELF-HOSTING.md is the
# walkthrough:
#
#   cp .env.docker.example .env.docker      # then fill it in
#   docker compose up -d --build            # database, migrations, app, jobs
#
# --build builds the images from this checkout. To run a published release
# instead (TIMEHERO_VERSION in .env, e.g. 0.1.0; default latest):
#
#   docker compose --profile tools pull && docker compose up -d --no-build
#   docker compose run --rm tools npm run setup -- --config prisma/config/example.json ...
#
# The app listens on port 3000. Put it behind a reverse proxy that terminates
# HTTPS (Caddy, nginx, Traefik): sign-in cookies and push need it.

# Docker's default json-file log grows without limit; keep the last 50 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    env_file: .env.docker
    environment:
      POSTGRES_USER: timehero
      POSTGRES_DB: timehero
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U timehero -d timehero']
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies any pending migrations, then exits. The app waits for it.
  migrate:
    build: { context: ., target: tools }
    image: ${TIMEHERO_IMAGE:-ghcr.io/mblank1240/timehero}-tools:${TIMEHERO_VERSION:-latest}
    env_file: .env.docker
    command: ['npx', 'prisma', 'migrate', 'deploy']
    logging: *logging
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: ., target: app }
    image: ${TIMEHERO_IMAGE:-ghcr.io/mblank1240/timehero}:${TIMEHERO_VERSION:-latest}
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - '${TIMEHERO_PORT:-3000}:3000'
    logging: *logging
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Posts to the job routes on the timetable in docker/scheduler.mjs.
  jobs:
    build: { context: ., target: app }
    image: ${TIMEHERO_IMAGE:-ghcr.io/mblank1240/timehero}:${TIMEHERO_VERSION:-latest}
    restart: unless-stopped
    env_file: .env.docker
    command: ['node', 'docker/scheduler.mjs']
    # The image's health check asks the web server, which this container
    # does not run; inherited, it would report unhealthy forever.
    healthcheck:
      disable: true
    logging: *logging
    depends_on:
      app: { condition: service_healthy }

  # `docker compose run --rm tools <command>`: setup, the import, Prisma.
  tools:
    build: { context: ., target: tools }
    image: ${TIMEHERO_IMAGE:-ghcr.io/mblank1240/timehero}-tools:${TIMEHERO_VERSION:-latest}
    env_file: .env.docker
    profiles: [tools]
    volumes:
      - ./prisma/config:/app/prisma/config:ro
      - ./import:/app/import:ro
    depends_on:
      db: { condition: service_healthy }

volumes:
  db:
